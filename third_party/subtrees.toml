[workspace]
root = "third_party/subtrees"

# This manifest records subtree-level decisions. Repo-level discovery remains
# in third_party/repositories.toml and third_party/manifests/*.toml.

[[subtrees]]
id = "dom_to_pptx"
full_name = "atharva9167j/dom-to-pptx"
upstream_url = "https://github.com/atharva9167j/dom-to-pptx.git"
upstream_ref = "master"
source_manifest = "third_party/repositories.toml"
source_category = "visual_object_ir_normalizer"
source_priority = 1
source_path = "."
subtree_prefix = "third_party/subtrees/dom-to-pptx"
import_mode = "whole_repo"
decision = "adopt_subtree"
requires_entrypoint_review = false
adapter = ""
validation_command = "npm test"
notes = "Adopt whole upstream package boundary; keep runtime core + agent skill bundle as separate responsibilities. bin/cli.js installs the skill bundle and is not the conversion runtime CLI."

[[subtrees]]
